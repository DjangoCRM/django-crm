
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    open-pull-requests-limit: 5
    schedule:
      interval: "daily"
      time: "06:00"
  - package-ecosystem: github-actions
    directory: "/"
    open-pull-requests-limit: 5
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
