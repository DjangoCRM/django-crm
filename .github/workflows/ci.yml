name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DJANGO_DEBUG: "false"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test-sqlite:
    name: test (sqlite)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Generate signing key
        run: echo "DJANGO_SECRET_KEY=$(python -c 'from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())')" >> "$GITHUB_ENV"
      - name: Startup smoke
        run: python manage.py check
      - name: Run tests with coverage
        id: tests
        run: |
          set +e
          coverage run manage.py test tests/ --noinput 2>&1 | tee test-output.log
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          exit "${exit_code}"
      - name: Generate coverage reports
        if: always() && steps.tests.outcome != 'cancelled'
        run: |
          coverage json -o coverage.json
          coverage xml -o coverage.xml
          coverage html -d htmlcov
      - name: Write coverage summary
        if: always() && steps.tests.outcome != 'cancelled'
        run: python .github/scripts/write_coverage_summary.py
      - name: Upload coverage reports
        if: always() && steps.tests.outcome != 'cancelled'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-sqlite
          path: |
            coverage.xml
            coverage.json
            htmlcov/
          retention-days: 30
      - name: Write leg summary
        if: always()
        run: bash .github/scripts/write_leg_summary.sh sqlite "${{ steps.tests.outputs.exit_code || 1 }}"

  test-postgres:
    name: test (postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d crm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate signing key
        run: echo "DJANGO_SECRET_KEY=$(python -c 'from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())')" >> "$GITHUB_ENV"
      - name: Startup smoke
        env:
          DATABASE_URL: postgresql://crm:crm@127.0.0.1:5432/crm_test
        run: python manage.py check
      - name: Run tests
        id: tests
        env:
          DATABASE_URL: postgresql://crm:crm@127.0.0.1:5432/crm_test
        run: |
          set +e
          python manage.py test tests/ --noinput 2>&1 | tee test-output.log
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          exit "${exit_code}"
      - name: Write leg summary
        if: always()
        run: bash .github/scripts/write_leg_summary.sh postgres "${{ steps.tests.outputs.exit_code || 1 }}"

  test-mysql:
    name: test (mysql)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: crm_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate signing key
        run: echo "DJANGO_SECRET_KEY=$(python -c 'from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())')" >> "$GITHUB_ENV"
      - name: Startup smoke
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/crm_test
        run: python manage.py check
      - name: Run tests
        id: tests
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/crm_test
        run: |
          set +e
          python manage.py test tests/ --noinput 2>&1 | tee test-output.log
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          exit "${exit_code}"
      - name: Write leg summary
        if: always()
        run: bash .github/scripts/write_leg_summary.sh mysql "${{ steps.tests.outputs.exit_code || 1 }}"

  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Generate signing key
        run: echo "DJANGO_SECRET_KEY=$(python -c 'from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())')" >> "$GITHUB_ENV"
      - name: Settings secret literal scan
        run: python manage.py check_secrets
      - name: Dependency vulnerability audit
        run: |
          # Fail on HIGH or CRITICAL advisories. To ignore temporarily, add:
          # --ignore-vuln CVE-YYYY-NNNN with a dated comment in this step.
          pip-audit -r requirements.txt --severity high
      - name: Supply-chain tests
        id: supply_chain_tests
        run: python manage.py test tests.security.test_no_secret_literals tests.test_settings_no_secrets tests.test_workflow_action_pins --noinput
      - name: Write leg summary
        if: always()
        run: bash .github/scripts/write_leg_summary.sh supply-chain "$([ '${{ steps.supply_chain_tests.outcome }}' = 'success' ] && echo 0 || echo 1)"
